[project]
name = "data-platform-core"
version = "0.1.0"
description = "Infrastructure as code and data contracts on AWS"
authors = [
    {name = "LilithFernandesP",email = "lilith.fernandes@sga.pucminas.br"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
]

[tool.poetry]
packages = [{ include = "platform_core", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyspark (==3.5.4)",
    "pytest (>=9.2.0,<10.0.0)",
    "chispa (>=0.12.0,<0.13.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
